name: 🐞 Bug Report
description: Report a bug or issue with the Vega app
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Brief summary
      description: Please describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide steps to reproduce the issue. Screenshots or videos can help.
    validations:
      required: false
  - type: input
    id: vega-version
    attributes:
      label: Vega version
      description: Specify the app version.
      placeholder: "1.0"
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing issues and this is not a duplicate or related to another open issue.
          required: true
